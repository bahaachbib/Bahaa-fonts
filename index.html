<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fancy Fonts</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b10;
            color: white;
            font-family: Arial, sans-serif;
            padding: 25px 15px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 5px;
        }

        .description {
            text-align: center;
            color: #999;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #17171f;
            color: white;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 15px;
            font-size: 18px;
            outline: none;
            resize: none;
        }

        textarea:focus {
            border-color: #8b5cf6;
        }

        .result {
            margin-top: 15px;
            padding: 15px;
            background: #17171f;
            border: 1px solid #292933;
            border-radius: 15px;
        }

        .font-text {
            font-size: 23px;
            word-wrap: break-word;
            margin-bottom: 12px;
        }

        button {
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 9px;
            padding: 9px 16px;
            font-size: 14px;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

<div class="container">

    <h1>✨ Fancy Fonts</h1>

    <p class="description">
        Write your text and choose your favorite font
    </p>

    <textarea id="input"
        placeholder="Write something here..."></textarea>

    <div id="results"></div>

</div>


<script>

const input = document.getElementById("input");
const results = document.getElementById("results");


function convert(text, start) {

    return [...text].map(char => {

        const code = char.codePointAt(0);

        // Capital letters
        if (code >= 65 && code <= 90) {
            return String.fromCodePoint(
                start + (code - 65)
            );
        }

        // Small letters
        if (code >= 97 && code <= 122) {
            return String.fromCodePoint(
                start + 26 + (code - 97)
            );
        }

        return char;

    }).join("");
}


// الخطوط
function normal(text) {
    return text;
}

function bold(text) {
    return convert(text, 0x1D400);
}

function italic(text) {
    return convert(text, 0x1D434);
}

function boldItalic(text) {
    return convert(text, 0x1D468);
}

function fraktur(text) {
    return convert(text, 0x1D504);
}

function double(text) {
    return convert(text, 0x1D538);
}

function mono(text) {
    return convert(text, 0x1D670);
}


function showFonts() {

    const text = input.value || "Your Text";

    const fonts = [
        normal(text),
        bold(text),
        italic(text),
        boldItalic(text),
        fraktur(text),
        double(text),
        mono(text)
    ];

    results.innerHTML = "";

    fonts.forEach(font => {

        const box = document.createElement("div");
        box.className = "result";

        const textElement = document.createElement("div");
        textElement.className = "font-text";
        textElement.textContent = font;

        const button = document.createElement("button");
        button.textContent = "Copy 📋";

        button.onclick = async () => {

            await navigator.clipboard.writeText(font);

            button.textContent = "Copied ✓";

            setTimeout(() => {
                button.textContent = "Copy 📋";
            }, 1200);
        };

        box.appendChild(textElement);
        box.appendChild(button);

        results.appendChild(box);
    });
}


input.addEventListener("input", showFonts);

showFonts();

</script>

</body>
</html>
